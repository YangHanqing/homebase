name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # This job stages the Apple signing certificate and the App Store Connect
      # API key, so an unverified download here would be handed the keys to
      # sign anything as us. Pin the archive by digest; bump both together.
      - name: Install rcodesign
        env:
          RCODESIGN_VERSION: "0.29.0"
          RCODESIGN_SHA256: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
        run: |
          set -euo pipefail
          archive="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${archive}.tar.gz"
          echo "${RCODESIGN_SHA256}  /tmp/rcodesign.tar.gz" | sha256sum -c -
          tar xzf /tmp/rcodesign.tar.gz -C /tmp
          sudo mv "/tmp/${archive}/rcodesign" /usr/local/bin/
          rcodesign --version

      - name: Stage Apple signing credentials
        run: |
          umask 077
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          printf '%s' "${{ secrets.MACOS_CERT_PASSWORD }}" > "$RUNNER_TEMP/cert.password"
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          rcodesign encode-app-store-connect-api-key \
            -o "$RUNNER_TEMP/api-key.json" \
            "${{ secrets.APPLE_API_ISSUER_ID }}" \
            "${{ secrets.APPLE_API_KEY_ID }}" \
            "$RUNNER_TEMP/AuthKey.p8"
          echo "HOMEBASE_SIGN_P12_PATH=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"
          echo "HOMEBASE_SIGN_P12_PASSWORD_FILE=$RUNNER_TEMP/cert.password" >> "$GITHUB_ENV"
          echo "HOMEBASE_SIGN_API_KEY_JSON=$RUNNER_TEMP/api-key.json" >> "$GITHUB_ENV"
          echo "HOMEBASE_SIGN_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wipe staged signing credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.password" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/api-key.json"
